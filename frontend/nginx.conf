server {
    listen 80;

    # Serve React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy health checks to backend
    location = /health {
        proxy_pass http://waf_backend_prod:8000/health;
    }

    location = /ready {
        proxy_pass http://waf_backend_prod:8000/ready;
    }

    # Proxy FastAPI Swagger UI
    location = /docs {
        proxy_pass http://waf_backend_prod:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy FastAPI OpenAPI JSON
    location = /openapi.json {
        proxy_pass http://waf_backend_prod:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy normal API requests to the FastAPI backend
    location /api/ {
        proxy_pass http://waf_backend_prod:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Specifically proxy SSE stream with buffering disabled
    location /api/v1/dashboard/stream {
        proxy_pass http://waf_backend_prod:8000/api/v1/dashboard/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
    }
}
